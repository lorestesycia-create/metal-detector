<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101a">
<title>Metal Detector</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main class="app">

<header>
  <h1>METAL DETECTOR</h1>
  <div id="mode" class="mode">MODO BÁSICO</div>
</header>

<section class="detector">

  <div class="gauge">
    <svg viewBox="0 0 300 170">
      <path d="M30 145 A120 120 0 0 1 105 35"
            fill="none" stroke="#27d17f" stroke-width="18"/>
      <path d="M105 35 A120 120 0 0 1 205 45"
            fill="none" stroke="#f1c84b" stroke-width="18"/>
      <path d="M205 45 A120 120 0 0 1 270 145"
            fill="none" stroke="#e95555" stroke-width="18"/>
    </svg>

    <div id="needle" class="needle"></div>
    <div class="pivot"></div>
  </div>

  <div class="reading">
    <span id="value">--</span>
    <small>µT</small>
  </div>

  <div id="status" class="status">INICIANDO SENSOR…</div>

</section>

<section class="controls">

<button id="sound" class="sound">
🔊 SONIDO ACTIVADO
</button>

<button id="calibrate" class="calibrate">
CALIBRAR DETECTOR
</button>

<p id="info">
Acerca lentamente el teléfono al objeto que quieras comprobar.
</p>

<button id="privacy" class="privacy hidden">
Opciones de privacidad
</button>

</section>

<div class="ad-space"></div>

</main>

<script src="app.js"></script>
</body>
</html>
